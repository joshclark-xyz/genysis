<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set a New Password | Genysis IQ</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04060c">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="auth-body">

<aside class="auth-aside">
  <a class="brand" href="index.html" aria-label="Genysis IQ — home">
    <img src="assets/genysis-logo-h.png"
         srcset="assets/genysis-logo-h.png 1x, assets/genysis-logo-h@2x.png 2x"
         width="620" height="100" alt="Genysis IQ — Scale Smarter. Grow Faster.">
  </a>
  <div class="auth-pitch">
    <p class="label">Password reset</p>
    <h1 class="display">One step and you're <em>back in.</em></h1>
    <p>Choose a new password for your Genysis IQ dashboard.</p>
  </div>
  <div class="auth-foot">
    <a href="index.html">Back to genysisiq.com</a>
    <a href="mailto:info@genysisiq.com">info@genysisiq.com</a>
  </div>
</aside>

<main class="auth-main">
  <div class="auth-card">
    <header>
      <h2>Set a new password.</h2>
      <p>Make it at least 8 characters.</p>
    </header>

    <div class="alert" id="upAlert" hidden role="alert"></div>

    <form class="stack" id="updateForm" novalidate>
      <div class="field">
        <label for="upPassword">New password</label>
        <span class="pw-wrap">
          <input id="upPassword" type="password" autocomplete="new-password" required placeholder="At least 8 characters">
          <button class="pw-toggle" type="button" data-toggle="upPassword">Show</button>
        </span>
        <span class="field-error">Please choose a password of at least 8 characters.</span>
      </div>
      <div class="field">
        <label for="upConfirm">Confirm new password</label>
        <span class="pw-wrap">
          <input id="upConfirm" type="password" autocomplete="new-password" required placeholder="Re-enter your password">
          <button class="pw-toggle" type="button" data-toggle="upConfirm">Show</button>
        </span>
        <span class="field-error">The two passwords do not match.</span>
      </div>
      <button class="btn btn-primary btn-lg" type="submit" data-label="Update password">Update password</button>
    </form>

    <p class="auth-alt"><a href="login.html" style="color:var(--blue-soft)">Back to sign in</a></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/auth.js"></script>
<script>
(function () {
  "use strict";
  var Auth = window.GenysisAuth;
  var $ = function (s) { return document.querySelector(s); };
  var form = $("#updateForm"), alertEl = $("#upAlert");
  var btn = form.querySelector("button[type=submit]");

  [].slice.call(document.querySelectorAll(".pw-toggle")).forEach(function (b) {
    b.addEventListener("click", function () {
      var i = document.getElementById(b.getAttribute("data-toggle"));
      var showing = i.type === "text";
      i.type = showing ? "password" : "text";
      b.textContent = showing ? "Show" : "Hide";
    });
  });

  function say(kind, title, body) {
    alertEl.className = "alert alert--" + kind;
    alertEl.innerHTML = (title ? "<strong>" + title + "</strong>" : "") + body;
    alertEl.hidden = false;
  }

  if (!Auth.isConfigured()) {
    say("warn", "Not connected yet",
        "Add your Supabase project URL and anon key to <code>assets/js/supabase-config.js</code>.");
    btn.disabled = true;
    return;
  }

  /* Arriving from the recovery email gives us a temporary session. Without one,
     the link was never clicked (or has expired). */
  var ready = false;
  Auth.onAuthChange(function (event) {
    if (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") ready = true;
  });

  Auth.getSession().then(function (res) {
    if (res.data && res.data.session) { ready = true; return; }
    setTimeout(function () {
      if (!ready) {
        say("err", "This link is not valid",
            'It may have expired or already been used. ' +
            '<a href="login.html">Request a new reset link</a>.');
        btn.disabled = true;
      }
    }, 1200);
  });

  form.addEventListener("input", function (e) {
    var f = e.target.closest(".field");
    if (f) f.classList.remove("is-invalid");
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    alertEl.hidden = true;

    var pw = $("#upPassword"), pw2 = $("#upConfirm"), ok = true;
    if (pw.value.length < 8) { pw.closest(".field").classList.add("is-invalid"); ok = false; }
    if (pw2.value !== pw.value || !pw2.value) { pw2.closest(".field").classList.add("is-invalid"); ok = false; }
    if (!ok) return;

    btn.disabled = true;
    btn.textContent = "Updating…";

    Auth.updatePassword(pw.value)
      .then(function (res) {
        if (res.error) throw res.error;
        say("ok", "Password updated. ", "Taking you to your dashboard…");
        setTimeout(function () { location.replace("dashboard.html"); }, 1400);
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = btn.getAttribute("data-label");
        say("err", "Could not update the password. ", Auth.humanize(err));
      });
  });
})();
</script>
</body>
</html>
